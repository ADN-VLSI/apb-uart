name: Add Issue to adnsemicon Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.ADN_SECRET_FOEZ_PAT }}
        run: |
          PROJECT_ID=$(gh api graphql -f query='
          {
            organization(login:"adnsemicon") {
              projectV2(number:2) {
                id
              }
            }
          }' --jq '.data.organization.projectV2.id')

          gh api graphql -f query='
            mutation($project:ID!, $content:ID!) {
              addProjectV2ItemById(input:{
                projectId:$project,
                contentId:$content
              }) {
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="${{ github.event.issue.node_id }}"
